name: Dictora

options:
  bundleIdPrefix: com.dictora
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"

configFiles:
  Debug: Dictora/Configuration/Shared.xcconfig
  Release: Dictora/Configuration/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  # Shared code lives in App/Shared, Core, Features and Resources. Anything that
  # depends on AppKit/UIKit or on a platform-only capability lives in
  # App/<platform> or Platform/<platform> and is compiled into one target only.
  DictoraMac:
    type: application
    platform: macOS
    sources:
      - path: Dictora/App/Shared
      - path: Dictora/App/macOS
      - path: Dictora/Core
      - path: Dictora/Features
      - path: Dictora/Platform/macOS
      - path: Dictora/Resources
      - path: Dictora/Configuration
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: $(DICTORA_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: DictoraMac
        PRODUCT_BUNDLE_IDENTIFIER: $(DICTORA_BUNDLE_ID_MAC)
        INFOPLIST_FILE: Dictora/Configuration/Info-macOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Dictora/Configuration/Dictora-macOS.entitlements
        # Must be a real certificate, not ad-hoc. macOS ties the Accessibility
        # grant to an ad-hoc binary's code hash, so every rebuild would revoke
        # it — see DEVELOPMENT_TEAM in Shared.xcconfig.
        #
        # Manual, not Automatic: a Mac app with no profile-bearing capabilities
        # needs no provisioning profile, and asking for one makes the build fail
        # unless the Mac is registered with the developer account.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  DictoraiOS:
    type: application
    platform: iOS
    sources:
      - path: Dictora/App/Shared
      - path: Dictora/App/iOS
      - path: Dictora/Core
      - path: Dictora/Features
      - path: Dictora/Platform/iOS
      - path: Dictora/Resources
      - path: Dictora/Configuration
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: $(DICTORA_PRODUCT_NAME)
        PRODUCT_MODULE_NAME: DictoraiOS
        PRODUCT_BUNDLE_IDENTIFIER: $(DICTORA_BUNDLE_ID_IOS)
        INFOPLIST_FILE: Dictora/Configuration/Info-iOS.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  DictoraMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DictoraMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DICTORA_BUNDLE_ID_MAC).tests
        GENERATE_INFOPLIST_FILE: YES
        # Must match the host app's identity. macOS refuses to load a bundle
        # into a process signed by a different team, so an ad-hoc test bundle
        # cannot be injected into the now properly signed app.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(DICTORA_PRODUCT_NAME).app/Contents/MacOS/$(DICTORA_PRODUCT_NAME)
        BUNDLE_LOADER: $(TEST_HOST)

  DictoraiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: DictoraiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DICTORA_BUNDLE_ID_IOS).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(DICTORA_PRODUCT_NAME).app/$(DICTORA_PRODUCT_NAME)
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  DictoraMac:
    build:
      targets:
        DictoraMac: all
        DictoraMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DictoraMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  DictoraiOS:
    build:
      targets:
        DictoraiOS: all
        DictoraiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DictoraiOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
